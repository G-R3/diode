<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Part palette options</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#000; color:#f5f5f5; }
      * { box-sizing: border-box; } body { margin:0; padding:28px; background:#000; }
      h1 { margin:0 0 8px; font-size:18px; } p { color:#a1a1aa; margin:0 0 28px; font-size:14px; }
      .options { display:grid; grid-template-columns:repeat(3,minmax(230px,1fr)); gap:20px; max-width:1080px; }
      .option { border:1px solid #292929; border-radius:12px; background:#080808; padding:14px; }
      .option h2 { margin:0 0 12px; font-size:13px; letter-spacing:.08em; color:#a1a1aa; }
      .palette { background:#101010; border:1px solid #303030; border-radius:10px; padding:12px; box-shadow:0 12px 32px #000; }
      .title { font-size:14px; font-weight:650; margin:2px 4px 10px; }
      .part { width:100%; border:0; color:#eee; background:transparent; display:flex; align-items:center; text-align:left; border-radius:8px; padding:7px 6px; gap:11px; font:inherit; }
      .part.selected { background:#262626; } .part:hover { background:#1d1d1d; }
      .thumb { width:42px; height:42px; flex:0 0 42px; border-radius:7px; background:#202127; display:grid; place-items:center; }
      .part-name { font-size:14px; font-weight:520; } .hint { color:#8e8e98; font-size:11px; margin-left:auto; }
      .divider { height:1px; background:#303030; margin:9px 4px; }
      .compact .part { display:grid; justify-items:center; gap:5px; padding:7px 4px; } .compact .part-name { font-size:10px; }
      .compact .parts { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }.compact .hint { display:none; }
      .cards .part { flex-direction:column; align-items:flex-start; padding:10px; gap:9px; border:1px solid #303030; }.cards .parts { display:grid; grid-template-columns:1fr 1fr; gap:7px; }.cards .thumb { width:100%; height:54px; }.cards .hint { margin-left:0; }
      svg { width:36px; height:36px; overflow:visible; }
      @media (max-width:760px) { body{padding:16px}.options{grid-template-columns:1fr;} }
    </style>
  </head>
  <body>
    <h1>Insert-part palette directions</h1>
    <p>All options use the current app’s dark visual system. Thumbnails stand in for the eventual rendered 3D models.</p>
    <main class="options">
      <section class="option"><h2>A · Recommended: familiar labeled list</h2><Palette /></section>
      <section class="option compact"><h2>B · Compact grid</h2><Palette /></section>
      <section class="option cards"><h2>C · Larger catalog cards</h2><Palette /></section>
    </main>
    <template id="palette"><div class="palette"><div class="title">Insert part</div><div class="parts"></div><div class="divider"></div><button class="part"><span class="thumb"><svg viewBox="0 0 42 42"><path d="M5 29C12 13 30 13 37 29" fill="none" stroke="#e05050" stroke-width="2"/><circle cx="5" cy="29" r="2" fill="#c9c9c9"/><circle cx="37" cy="29" r="2" fill="#c9c9c9"/></svg></span><span class="part-name">Jumper wire</span><span class="hint">W</span></button></div></template>
    <script>
      const parts=[['Resistor','<path d="M2 22h8l3-7 5 14 5-14 5 14 3-7h9" fill="none" stroke="#d8b778" stroke-width="3"/><path d="M12 22h20" stroke="#d84b45" stroke-width="2"/>'],['LED','<path d="M19 26v12M24 26v12" stroke="#c5c8cc" stroke-width="2"/><path d="M14 14a7 7 0 0 1 14 0v12H14z" fill="#ef4444"/><path d="M14 20h14" stroke="#ffaaaa"/>'],['Push button','<path d="M10 25h22v8H10z" fill="#303038"/><path d="M15 33v5M27 33v5" stroke="#c5c8cc" stroke-width="2"/><rect x="14" y="10" width="14" height="16" rx="5" fill="#e84343"/><ellipse cx="21" cy="12" rx="7" ry="3" fill="#ff6b6b"/>']];
      document.querySelectorAll('.option').forEach((option)=>{const p=document.querySelector('#palette').content.cloneNode(true);const list=p.querySelector('.parts');parts.forEach(([name,art],i)=>{const b=document.createElement('button');b.className='part'+(i===0?' selected':'');b.innerHTML='<span class="thumb"><svg viewBox="0 0 42 42">'+art+'</svg></span><span class="part-name">'+name+'</span><span class="hint">'+(i===0?'R':'')+'</span>';list.append(b)});option.querySelector('Palette').replaceWith(p)});
    </script>
  </body>
</html>
